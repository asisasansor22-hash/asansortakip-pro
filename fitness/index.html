<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GYMO" />
    <title>GYMO — Gym Obsession</title>
    <!-- Temayı ilk boyamadan ÖNCE uygula: aksi halde açık tema seçili olsa bile
         bir an koyu ekran görünür ("flash of wrong theme"). Betik bilinçli
         olarak satır içi ve senkron. JS çalışmazsa <html> üzerinde data-theme
         olmaz ve CSS'teki koyu varsayılan geçerli kalır. -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem("fitbe_theme") || "system";
          var dark = m === "system"
            ? !window.matchMedia("(prefers-color-scheme: light)").matches
            : m === "dark";
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          var mt = document.querySelector('meta[name="theme-color"]');
          if (mt) mt.setAttribute("content", dark ? "#0f172a" : "#f1f5f9");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
